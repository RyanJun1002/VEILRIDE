<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101815" />
    <meta name="description" content="VEILDRIVE — 안개 낀 능선을 끝없이 달리는 3D 드라이빙 게임" />
    <title>VEILDRIVE</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="VEILDRIVE 3D 드라이빙 게임"></canvas>

      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <main id="menu" class="menu">
        <div class="menu__eyebrow"><span></span> AN ENDLESS DRIVE</div>
        <h1>VEIL<span>DRIVE</span></h1>
        <p>안개가 머무는 능선. 엔진 소리. 그리고 끝나지 않는 코너.</p>
        <button id="startButton" class="start-button">
          <span>DRIVE</span>
          <small>엔진 시동</small>
        </button>
        <div class="menu__controls">
          <div><kbd>W</kbd><span>전진</span></div>
          <div><kbd>SHIFT</kbd><span>추가 가속</span></div>
          <div><kbd>A / D</kbd><span>방향 전환</span></div>
          <div><kbd>S</kbd><span>브레이크</span></div>
          <div><kbd>SPACE</kbd><span>핸드브레이크</span></div>
          <div><kbd>Q</kbd><span>시간대</span></div>
          <div><kbd>E</kbd><span>계절</span></div>
          <div><kbd>C</kbd><span>카메라</span></div>
          <div><kbd>R</kbd><span>복귀</span></div>
        </div>
      </main>

      <section id="hud" class="hud is-hidden" aria-live="polite">
        <div class="brand">VEIL<span>DRIVE</span></div>
        <div class="route-chip"><i></i><span>RIDGEWAY 09</span><small id="distance">0.0 KM</small></div>

        <div class="speedometer">
          <span id="gear" class="gear">D</span>
          <div><strong id="speed">000</strong><small>KM/H</small></div>
          <div class="speed-bar"><i id="speedBar"></i></div>
        </div>

        <div id="nearMiss" class="near-miss">NEAR MISS <span>+500</span></div>
        <div id="hint" class="hint"><kbd>W</kbd> 90 KM/H &nbsp; <kbd>SHIFT</kbd> 제한 해제</div>
        <button id="pauseButton" class="icon-button" aria-label="일시정지">Ⅱ</button>
        <div class="touch-controls" aria-label="모바일 주행 조작">
          <div><button data-touch="left">←</button><button data-touch="right">→</button></div>
          <div><button data-touch="gas" class="gas-touch">↑</button></div>
        </div>
      </section>

      <section id="pause" class="pause is-hidden">
        <p>JOURNEY PAUSED</p>
        <h2>잠시 숨을 고르세요.</h2>
        <button id="resumeButton">계속 달리기</button>
        <button id="restartButton" class="secondary">처음부터</button>
      </section>

      <div id="toast" class="toast">도로로 복귀했습니다</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
